<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้า — ไดอารี่คนเห็นผี</title>
<meta name="robots" content="noindex">
<style>
  /* inline on purpose: GitHub Pages serves this file from any path, so relative CSS links would break */
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 40%, #3a0807, #060304 70%); color: #f3e9e2; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: clamp(4rem, 22vw, 9rem); margin: 0; color: #ff3b2f; text-shadow: 0 0 40px rgba(255, 59, 47, .6); font-weight: 800; line-height: 1; }
  p { color: #bfaba4; margin: 12px 0 24px; }
  a { display: inline-block; min-height: 48px; line-height: 48px; padding: 0 22px; border-radius: 6px; background: #ff3b2f; color: #1a0303; text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 3px solid #ffd866; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>หน้านี้หายไปเหมือนผี… หรืออาจไม่เคยมีอยู่ตั้งแต่แรก</p>
  <a id="home" href="/">กลับไปที่สมุด</a>
</main>
<script>
  // project sites live under /<repo>/, so build the way home from the first path segment
  var seg = location.pathname.split('/')[1];
  var isUserSite = /\.github\.io$/.test(location.hostname) && seg && seg.indexOf('.') === -1;
  document.getElementById('home').href = isUserSite ? '/' + seg + '/' : '/';
</script>
</body>
</html>
